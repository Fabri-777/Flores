<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Porque todas las reinas merecen flores amarillas. Una dedicatoria hecha de polvo de oro.">
  <title>Flores para una reina</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8'/%3E%3Cpath d='M16 4 19 12 28 16 19 19 16 28 12 19 4 16 12 12Z' fill='%23f7ce55'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#e7c979}body{font-family:Georgia,'Times New Roman',serif;overflow:hidden}
    .scene{position:relative;width:100%;height:100svh;min-height:360px;isolation:isolate;background:#000;overflow:hidden}
    canvas{display:block;width:100%;height:100%;touch-action:pan-y}
    .dedication{position:absolute;left:20px;right:20px;margin:0;text-align:center;font-weight:400;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 1.7s ease,transform 1.7s ease;line-height:1.22;color:#ecd185;text-shadow:0 0 24px #ce971e55}
    .above{top:9%;font-size:clamp(24px,3.6vw,49px);letter-spacing:.025em}
    .below{bottom:13%;font-size:clamp(25px,3.9vw,54px);font-style:italic;letter-spacing:.015em}
    .revealed .dedication{opacity:1;transform:translateY(0)}
    .controls{position:absolute;bottom:23px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap}
    button{font:400 12px/1.2 system-ui,sans-serif;letter-spacing:.09em;color:#c2aa70;background:#000b;border:1px solid #aa873434;border-radius:24px;min-height:44px;padding:0 19px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
    button:hover{color:#ffe7a2;border-color:#c8a65499;background:#211906}button:focus-visible{outline:2px solid #f3d17d;outline-offset:4px}
    .hint{position:absolute;bottom:80px;width:100%;text-align:center;font:11px/1.4 system-ui,sans-serif;letter-spacing:.14em;color:#a68d55;pointer-events:none;opacity:0;transition:opacity 2s}.revealed .hint{opacity:.8}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @media(max-width:520px){.above{top:13%;font-size:clamp(21px,5.7vw,29px)}.below{bottom:19%;font-size:clamp(22px,5.9vw,30px)}.hint{bottom:83px;font-size:10px}.controls{bottom:24px}}
    @media(max-height:520px) and (min-width:521px){.above{top:5%;font-size:25px}.below{bottom:19%;font-size:27px}.hint{display:none}.controls{bottom:10px}button{min-height:36px}}
    @media(prefers-reduced-motion:reduce){.dedication{transition:none}}
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Una dedicatoria de flores amarillas">
    <canvas id="magic" role="img" aria-label="Partículas de oro forman tres ramos de tres flores, de derecha a izquierda. Después se reúnen en un gran ramo central.">Tu navegador no admite esta animación.</canvas>
    <h1 class="dedication above">Porque todas las reinas</h1>
    <p class="dedication below">merecen flores amarillas</p>
    <div class="hint" aria-hidden="true">MUEVE EL CURSOR O TOCA LA LUZ</div>
    <div class="controls">
      <button id="replay" type="button">Volver a florecer</button>
      <button id="pause" type="button" aria-label="Pausar animación">Pausar</button>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>
  <script>
  (()=>{
    'use strict';
    const canvas=document.getElementById('magic'),ctx=canvas.getContext('2d');
    const scene=document.getElementById('scene'),pauseButton=document.getElementById('pause');
    const status=document.getElementById('status');
    if(!ctx){status.textContent='Tu navegador no admite Canvas. Porque todas las reinas merecen flores amarillas.';scene.classList.add('revealed');return;}
    const TAU=Math.PI*2,clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},lerp=(a,b,t)=>a+(b-a)*t;
    let seed=74219;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
    const template=[];
    function point(x,y,tone=0,size=1){template.push({x,y,tone,size});}
    function line(x1,y1,x2,y2,n=75,tone=1){for(let i=0;i<n;i++){let u=i/(n-1);point(lerp(x1,x2,u)+(random()-.5)*1.6,lerp(y1,y2,u)+(random()-.5)*1.6,tone,.65+random()*.55)}}
    function bezier(a,b,c,d,n=100,tone=1){for(let i=0;i<n;i++){const t=i/(n-1),v=1-t;point(v*v*v*a[0]+3*v*v*t*b[0]+3*v*t*t*c[0]+t*t*t*d[0],v*v*v*a[1]+3*v*v*t*b[1]+3*v*t*t*c[1]+t*t*t*d[1],tone,.7+random()*.4)}}
    function leaf(x,y,angle,length){for(let j=0;j<3;j++)for(let i=0;i<55;i++){const u=i/54,w=Math.sin(Math.PI*u)*length*.23*(j-1);point(x+Math.cos(angle)*length*u-Math.sin(angle)*w,y+Math.sin(angle)*length*u+Math.cos(angle)*w,2,.75)}}
    // A reusable point mesh: three flowers, stems, folded paper and a bow.
    bezier([-75,-102],[-60,-10],[-8,42],[0,112],120,2);
    bezier([4,-165],[15,-61],[-12,49],[0,112],120,2);
    bezier([79,-105],[52,-29],[18,47],[0,112],120,2);
    leaf(-30,16,-2.55,62);leaf(27,1,-.65,65);leaf(-8,-33,-2.0,49);leaf(31,-57,-.48,39);
    function flower(cx,cy,r,rotation){
      for(let layer=0;layer<2;layer++){
        const petals=layer?13:15;
        for(let k=0;k<petals;k++){
          const a=k/petals*TAU+rotation+layer*.19,inner=r*.20,reach=r*(layer?.77:1),half=r*(layer?.115:.14);
          for(let j=0;j<40;j++){
            const u=j/40*TAU,rad=inner+(reach-inner)*(1-Math.cos(u))/2,w=Math.sin(u)*half;
            point(cx+Math.cos(a)*rad-Math.sin(a)*w,cy+Math.sin(a)*rad+Math.cos(a)*w,0,.6+random()*.65);
          }
          for(let j=0;j<12;j++){
            const u=random(),rad=lerp(inner,reach,u),w=(random()-.5)*half*1.4*Math.sin(u*Math.PI);
            point(cx+Math.cos(a)*rad-Math.sin(a)*w,cy+Math.sin(a)*rad+Math.cos(a)*w,0,.65);
          }
        }
      }
      for(let j=0;j<210;j++){const a=j*2.399963,radius=r*.255*Math.sqrt(j/210);point(cx+Math.cos(a)*radius,cy+Math.sin(a)*radius,1,.8+random()*.35)}
    }
    // Translucent paper is described entirely by gold dust, including fold lines.
    const left=[-117,-50],right=[117,-47],tip=[7,157];
    line(...left,-45,95,135);line(-45,95,...tip,85);line(...right,50,93,130);line(50,93,...tip,85);
    line(...left,25,86,140);line(...right,-26,96,140);line(-91,-21,...tip,150);line(83,-6,...tip,150);
    bezier(left,[-74,-3],[-30,17],[22,21],100);bezier(right,[78,-1],[50,12],[22,21],85);
    for(let i=0;i<750;i++){const u=random(),v=random(),x=lerp(-105,105,u)*(1-v),y=lerp(-31,149,v);point(x+7*v,y,1,.48+random()*.45)}
    bezier([0,99],[-81,53],[-55,137],[0,99],160,0);bezier([0,99],[75,47],[73,129],[0,99],160,0);
    bezier([0,99],[-4,135],[-42,139],[-30,167],80);bezier([0,99],[12,126],[45,145],[35,158],80);
    flower(-76,-104,53,.18);flower(3,-165,58,-.13);flower(78,-107,52,.26);
    // Sample the same mesh for each of the three identical bouquets.
    const mesh=template.filter((_,i)=>i%2===0),particles=[];
    for(let group=0;group<3;group++)for(let i=0;i<mesh.length;i++){
      const p=mesh[i];particles.push({...p,group,phase:random()*TAU,noise:random(),base:(random()-.5)*250,baseY:random()*12,scatterA:random()*TAU,scatterR:35+random()*280,offsetX:0,offsetY:0,vx:0,vy:0});
    }
    const dust=Array.from({length:130},()=>({x:random(),y:random(),phase:random()*TAU,r:.35+random()*.9}));
    const palette=['#ffdc5b','#ca9836','#d7b647'];
    const glow=document.createElement('canvas');glow.width=glow.height=32;const gc=glow.getContext('2d'),gradient=gc.createRadialGradient(16,16,0,16,16,16);gradient.addColorStop(0,'#fff0a8bb');gradient.addColorStop(.16,'#ffd45055');gradient.addColorStop(1,'#d68c0000');gc.fillStyle=gradient;gc.fillRect(0,0,32,32);
    let width=0,height=0,ratio=1,small=1,giant=1,centerY=0;
    function resize(){width=scene.clientWidth;height=scene.clientHeight;ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);small=Math.min(width/960,height/600,1.02);giant=Math.min(width/350,height*.57/390,1.65);centerY=height*.51;}
    new ResizeObserver(resize).observe(scene);resize();
    const reduce=matchMedia('(prefers-reduced-motion: reduce)');
    let elapsed=reduce.matches?8:0,paused=reduce.matches,last=0,frameId=0,revealed=false,hiddenPaused=false;
    const pointer={x:-9999,y:-9999,active:false};
    canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;pointer.active=true;if(paused)draw(elapsed,0)});
    canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;pointer.active=true});
    canvas.addEventListener('pointerleave',()=>{pointer.active=false});canvas.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')pointer.active=false});canvas.addEventListener('pointercancel',()=>{pointer.active=false});
    function draw(t,dt){
      ctx.clearRect(0,0,width,height);ctx.globalCompositeOperation='lighter';
      const final=ease((t-4.5)/1.25),dissolve=ease((t-3.5));
      for(const d of dust){const a=.12+.21*(.5+.5*Math.sin(t*.8+d.phase));ctx.globalAlpha=a;ctx.fillStyle='#e6bc53';ctx.beginPath();ctx.arc(d.x*width+Math.sin(t*.15+d.phase)*12,((d.y*height-t*3)%height+height)%height,d.r,0,TAU);ctx.fill();}
      for(let i=0;i<particles.length;i++){
        const p=particles[i],start=p.group; // Right at 0 s, centre at 1 s, left at 2 s.
        if(t<start)continue;
        const cx=width*.5+(1-p.group)*Math.min(width*.29,300),cy=centerY+25*small;
        const rise=ease((t-start-p.noise*.18)/1.05),delay=ease((t-start-.05-(155-p.y)/380*.22)/.9);
        const targetX=cx+p.x*small,targetY=cy+p.y*small;
        let x=lerp(cx+p.base*small,targetX,rise)+Math.sin(p.phase+t*2)*9*small*(1-rise);
        let y=lerp(cy+(170+p.baseY)*small,targetY,delay);
        if(t>=3.5){const angle=p.scatterA+(t-3.5)*.8,rad=p.scatterR*Math.min(width/750,height/650,1.1);const sx=width*.5+Math.cos(angle)*rad,sy=centerY+Math.sin(angle)*rad*.7;x=lerp(targetX,sx,dissolve);y=lerp(targetY,sy,dissolve);}
        if(t>=4.5){x=lerp(x,width*.5+p.x*giant+(p.group-1)*.32,final);y=lerp(y,centerY+p.y*giant,final);}
        const settled=t>=4.5?final:rise;x+=Math.sin(t*.85+p.phase)*.75*settled;y+=Math.cos(t*.7+p.phase)*.8*settled;
        if(dt>0){const dx=x+p.offsetX-pointer.x,dy=y+p.offsetY-pointer.y,dist=Math.hypot(dx,dy);if(pointer.active&&dist<85&&dist>1){const force=(1-dist/85)*120*dt;p.vx+=dx/dist*force;p.vy+=dy/dist*force;}const step=Math.min(dt*60,2);p.vx+=-p.offsetX*.025*step;p.vy+=-p.offsetY*.025*step;p.vx*=Math.pow(.86,step);p.vy*=Math.pow(.86,step);p.offsetX+=p.vx*step;p.offsetY+=p.vy*step;}
        x+=p.offsetX;y+=p.offsetY;
        const twinkle=.67+.33*Math.sin(p.phase+t*(1+p.noise));const opacity=(.5+.5*twinkle)*(t<3.5?clamp((t-start)*5):1);
        const scale=lerp(small,giant,final),size=Math.max(.48,p.size*scale)*(p.tone===0?1.1:.85);
        ctx.globalAlpha=opacity*(p.tone===1?.65:.92);ctx.fillStyle=palette[p.tone];ctx.fillRect(x,y,size,size);
        if(i%6===0){ctx.globalAlpha=opacity*(p.tone===0?.38:.18);const s=9*size;ctx.drawImage(glow,x-s/2,y-s/2,s,s);}
        if(i%293===0&&twinkle>.92){ctx.globalAlpha=(twinkle-.92)*8;ctx.fillStyle='#fff1b4';ctx.fillRect(x-3,y,7,.6);ctx.fillRect(x,y-3,.6,7);}
      }
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      if(t>=6.5&&!revealed){revealed=true;scene.classList.add('revealed');status.textContent='Porque todas las reinas merecen flores amarillas.';}
    }
    function frame(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!document.hidden)elapsed+=dt;draw(elapsed,paused?0:dt);if(!paused&&!document.hidden)frameId=requestAnimationFrame(frame);else frameId=0;}
    function run(){last=0;if(!frameId)frameId=requestAnimationFrame(frame);}
    function updateButton(){pauseButton.textContent=paused?'Continuar':'Pausar';pauseButton.setAttribute('aria-label',paused?'Continuar animación':'Pausar animación');}
    pauseButton.addEventListener('click',()=>{paused=!paused;updateButton();if(!paused)run()});
    document.getElementById('replay').addEventListener('click',()=>{elapsed=0;revealed=false;scene.classList.remove('revealed');status.textContent='La dedicatoria comienza de nuevo.';particles.forEach(p=>{p.offsetX=p.offsetY=p.vx=p.vy=0});paused=false;updateButton();run()});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){last=0;run()}});
    reduce.addEventListener('change',e=>{if(e.matches){elapsed=8;paused=true;updateButton();draw(elapsed,0)}});
    window.addEventListener('resize',()=>{if(paused)draw(elapsed,0)});
    updateButton();run();
  })();
  </script>
</body>
</html>
